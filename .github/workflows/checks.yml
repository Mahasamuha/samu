name: Checks

# Style, lint, typecheck and unit tests for each build unit. Also called by images.yml, so an image is never published
# from a commit that fails them.
on:
  push:
    # main runs these through images.yml, before tagging and publishing.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: ${{ matrix.unit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        unit: [gateway, mcp]
    defaults:
      run:
        working-directory: ${{ matrix.unit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The pnpm version comes from "packageManager" in package.json, as in the Dockerfiles.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # pnpm lint (typescript-eslint) is off until typescript-eslint supports TypeScript 7; see docs/testing.md.

      - run: pnpm typecheck

      - run: pnpm test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The version in gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The build reads the gitignored config.local.properties; the example's placeholders are enough to compile.
      - name: Use the example app config
        run: cp config.example.properties config.local.properties

      - run: ./gradlew ktlintCheck

      - run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-test-reports
          path: app/build/reports/tests/
