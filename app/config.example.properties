# Copy to config.local.properties (gitignored) and fill in. No secrets here: these are public client settings.
# Issuer exactly as in the token's "iss" claim, with the trailing slash.
assistant.issuerUrl=https://<issuer-host>/application/o/<application-slug>/
assistant.clientId=<client-id>
# The gateway URL isn't set here: enter it on the app's setup screen.
